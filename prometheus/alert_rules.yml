groups:
  - name: model-alerts
    rules:
      - alert: ModelServiceDown
        expr: up{job="model-service"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Model service is not reachable"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"4..|5.."}[1m]))
          / sum(rate(http_requests_total[1m])) > 0.05
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "More than 5% of requests are failing"

      - alert: HighP95Latency
        expr: |
          histogram_quantile(0.95, sum by (le)
          (rate(http_request_duration_seconds_bucket{endpoint="/predict"}[1m]))) > 0.5
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "p95 prediction latency above 500 ms"

      - alert: FeatureDriftDetected
        expr: abs(model_feature_drift_zscore) > 3
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Feature {{ $labels.feature }} has drifted from training data"

      - alert: LowModelAccuracy
        expr: |
          sum(increase(model_feedback_total{outcome="correct"}[5m]))
          / sum(increase(model_feedback_total[5m])) < 0.85
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Accuracy on labelled feedback fell below 85%"